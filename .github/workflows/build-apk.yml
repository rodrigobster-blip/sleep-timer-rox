name: Build Sleep Timer Rox V2 APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aceptar licencias Android SDK
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Compilar APK instalable
        run: gradle assembleDebug --no-daemon

      - name: Preparar archivo APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sleep-Timer-Rox-V2.apk

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Sleep-Timer-Rox-V2-APK
          path: dist/Sleep-Timer-Rox-V2.apk
          retention-days: 30
